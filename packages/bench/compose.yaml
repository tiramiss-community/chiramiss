# src/cli.ts から `docker compose -f compose.yaml -p chiramiss-bench ...` で使う。
# BENCH_* / SUMMALY_IMAGE と .env.<target> は cli が用意する。直接 `docker compose up` するためのファイルではない。

x-target: &target
  cpus: ${BENCH_CPUS}
  mem_limit: ${BENCH_MEMORY}
  volumes:
    - ./certs:/certs:ro
  networks:
    - bench
  healthcheck:
    test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0),()=>process.exit(1))"]
    start_period: 60s
    start_interval: 500ms
    # 起動後は計測中の CPU に混ざらないよう、ほぼ走らせない。
    interval: 1h

networks:
  bench:
    ipam:
      config:
        - subnet: ${BENCH_SUBNET}

services:
  origin:
    image: ${BENCH_NODE_IMAGE}
    entrypoint: ['node', '/bench/src/origin-main.ts']
    volumes:
      - ./src:/bench/src:ro
      - ./certs:/certs:ro
    networks:
      bench:
        aliases:
          - origin.bench
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9000/stats').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      start_period: 60s
      start_interval: 500ms
      interval: 1h

  chiramiss:
    <<: *target
    build:
      context: ../..
      args:
        NODE_IMAGE: ${BENCH_NODE_IMAGE}
    image: chiramiss-bench:local
    env_file: .env.chiramiss

  summaly:
    <<: *target
    image: ${SUMMALY_IMAGE}
    env_file: .env.summaly

  loadgen:
    image: ${BENCH_NODE_IMAGE}
    profiles: [tools]
    entrypoint: ['node', '/bench/src/loadgen-main.ts']
    volumes:
      - ./src:/bench/src:ro
    networks:
      - bench
